<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat — places answer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/smokedglass/tokens.css">
<link rel="stylesheet" href="ds/smokedglass/components/bundle.css">
<script src="ds/smokedglass/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-text)}a:hover{color:var(--label)}
</style>
</helmet>
<div data-theme="{{theme}}" class="sg-screen" style="width: 390px; height: 844px; font-family: var(--font-sans); color: var(--label); background: var(--canvas);">
<main class="sg-pane sg-pane-main" aria-label="Lisbon trip">
<div class="sg-pane-scroll" style="padding-bottom: 160px; padding-top: 100px;">
<div style="display: flex; flex-direction: column; gap: 16px;">
<x-import component-from-global-scope="SmokedGlass.Message" by="user">Somewhere good for dinner near the hotel on Saturday? Not too touristy.</x-import>
<x-import component-from-global-scope="SmokedGlass.Message" by="agent">Three places within a short walk of your hotel in Alfama, all open on Saturday evening.</x-import>
<x-import component-from-global-scope="SmokedGlass.MapPreview" height="{{mapH}}" title="3 places near your hotel" subtitle="Alfama · Saturday 14 Nov" action="{{openMap}}" pins="{{pins}}"></x-import>
<x-import component-from-global-scope="SmokedGlass.ListGroup" glass="{{no}}">
<x-import component-from-global-scope="SmokedGlass.ListRow" icon="location" tint="orange" title="Taberna do Largo" subtitle="Portuguese · 6 min walk · from 19:00" on-click="{{noop}}"></x-import>
<x-import component-from-global-scope="SmokedGlass.ListRow" icon="location" tint="orange" title="Cantinho da Sé" subtitle="Seafood · 9 min walk · from 18:30" on-click="{{noop}}"></x-import>
<x-import component-from-global-scope="SmokedGlass.ListRow" icon="location" tint="orange" title="Casa da Esquina" subtitle="Petiscos · 12 min walk · from 19:30" on-click="{{noop}}"></x-import>
</x-import>
<x-import component-from-global-scope="SmokedGlass.Message" by="agent">Want me to put one of them on your calendar for Saturday at 20:00?</x-import>
</div>
</div>
<x-import component-from-global-scope="SmokedGlass.TopEdge" title="{{topTitle}}" show="{{yes}}"></x-import>
<div class="sg-dock">
<x-import component-from-global-scope="SmokedGlass.Cluster" variant="{{c.variant}}" tabs="{{c.tabs}}" tab="{{c.tab}}" on-tab="{{noop}}" back="{{c.back}}" actions="{{c.actions}}" primary="{{c.primary}}" accessory="{{c.accessory}}" sheet="{{c.sheet}}" search="{{c.search}}" gather="{{c.gather}}" flat="{{c.flat}}" minimized="{{c.minimized}}" style="width: 100%;"></x-import>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const noop = function () {};
const TABS = [{ id: 'chat', label: 'Chat', icon: 'bubble' }, { id: 'calendar', label: 'Calendar', icon: 'calendar' }, { id: 'tasks', label: 'Tasks', icon: 'checklist', badge: 3 }, { id: 'wiki', label: 'Wiki', icon: 'book' }, { id: 'you', label: 'You', icon: 'person' }];
const SEARCH = { label: 'Search', placeholder: 'Search everything', onOpen: noop, onQuery: noop };
const CHAT_ACTIONS = [{ id: 'share', label: 'Share', icon: 'share' }, { id: 'rename', label: 'Rename', icon: 'square-pencil' }, { id: 'pin', label: 'Pin', icon: 'pin' }, { id: 'delete', label: 'Delete', icon: 'trash', destructive: true }];
const REPLY = { kind: 'composer', key: 'reply', placeholder: 'Reply…' };
const LATER = { icon: 'xmark', label: 'Later', onClick: noop };
return Object.assign({ theme: (this.props.dark ?? true) ? 'dark' : 'light', no: false, yes: true, noop: noop }, { topTitle: 'Lisbon trip', mapH: 200, openMap: { label: 'Open Map', icon: 'map' },
pins: [{ x: 30, y: 62, tint: 'orange', active: true, label: 'Taberna do Largo' }, { x: 58, y: 44, tint: 'orange' }, { x: 80, y: 70, tint: 'orange' }, { x: 46, y: 82, tint: 'blue' }],
c: { variant: 'row', tabs: TABS, tab: 'chat', back: { onClick: noop }, actions: CHAT_ACTIONS, accessory: REPLY } });
}
}
</script>
</body>
</html>
