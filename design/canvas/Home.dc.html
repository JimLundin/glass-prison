<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proposal — Today as home</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/smokedglass/tokens.css">
<link rel="stylesheet" href="ds/smokedglass/components/bundle.css">
<script src="ds/smokedglass/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-text)}a:hover{color:var(--label)}
</style>
</helmet>
<div data-theme="{{theme}}" class="sg-screen" style="width: 390px; height: 844px; font-family: var(--font-sans); color: var(--label); background: var(--canvas);">
<main class="sg-pane sg-pane-main" aria-label="Today">
<div class="sg-pane-scroll" style="padding-bottom: 160px;">
<header class="sg-pane-header" style="padding-top: 72px;">
<p class="sg-pane-eyebrow footnote">Thursday 22 October</p>
<h1 class="sg-pane-title large-title">Today</h1>
</header>
<div class="sg-pane-content">
<x-import component-from-global-scope="SmokedGlass.ListGroup" header="Needs you" glass="{{no}}">
<x-import component-from-global-scope="SmokedGlass.ListRow" icon="calendar" tint="orange" title="Add “Lisbon weekend”?" subtitle="Lisbon trip · 2 min" on-click="{{noop}}"></x-import>
<x-import component-from-global-scope="SmokedGlass.ListRow" icon="bubble" tint="indigo" title="Which quarter goals first?" subtitle="Q4 planning · 1 h" on-click="{{noop}}"></x-import>
</x-import>
<x-import component-from-global-scope="SmokedGlass.ListGroup" header="Tomorrow" glass="{{no}}">
<x-import component-from-global-scope="SmokedGlass.EventRow" time="09:00" tint="teal" title="Standup" meta="15 min · Video call"></x-import>
<x-import component-from-global-scope="SmokedGlass.EventRow" time="11:30" tint="pink" title="Lunch with Maja" meta="1 h" location="Café Pascal"></x-import>
</x-import>
<x-import component-from-global-scope="SmokedGlass.ListGroup" header="Due today" glass="{{no}}">
<x-import component-from-global-scope="SmokedGlass.TaskRow" title="Send kitchen quote decision to Erik" meta="Kitchen remodel · 17:00"></x-import>
<x-import component-from-global-scope="SmokedGlass.TaskRow" title="Check passport expiry date" meta="Lisbon trip" agent="{{yes}}"></x-import>
</x-import>
<x-import component-from-global-scope="SmokedGlass.ItemCard" icon="pin" tint="teal" title="Packing list — Lisbon" subtitle="Pinned wiki page" href="Wiki.dc.html"></x-import>
</div>
</div>
<div class="sg-dock">
<x-import component-from-global-scope="SmokedGlass.Cluster" variant="{{c.variant}}" tabs="{{c.tabs}}" tab="{{c.tab}}" on-tab="{{noop}}" back="{{c.back}}" actions="{{c.actions}}" primary="{{c.primary}}" accessory="{{c.accessory}}" sheet="{{c.sheet}}" search="{{c.search}}" gather="{{c.gather}}" flat="{{c.flat}}" minimized="{{c.minimized}}" style="width: 100%;"></x-import>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const noop = function () {};
const TABS = [{ id: 'chat', label: 'Chat', icon: 'bubble' }, { id: 'calendar', label: 'Calendar', icon: 'calendar' }, { id: 'tasks', label: 'Tasks', icon: 'checklist', badge: 3 }, { id: 'wiki', label: 'Wiki', icon: 'book' }, { id: 'you', label: 'You', icon: 'person' }];
const SEARCH = { label: 'Search', placeholder: 'Search everything', onOpen: noop, onQuery: noop };
const CHAT_ACTIONS = [{ id: 'share', label: 'Share', icon: 'share' }, { id: 'rename', label: 'Rename', icon: 'square-pencil' }, { id: 'pin', label: 'Pin', icon: 'pin' }, { id: 'delete', label: 'Delete', icon: 'trash', destructive: true }];
const REPLY = { kind: 'composer', key: 'reply', placeholder: 'Reply…' };
const LATER = { icon: 'xmark', label: 'Later', onClick: noop };
return Object.assign({ theme: (this.props.dark ?? true) ? 'dark' : 'light', no: false, yes: true, noop: noop }, { c: { variant: 'row', tabs: [{ id: 'today', label: 'Today', icon: 'clock' }].concat(TABS), tab: 'today', search: SEARCH, accessory: { kind: 'composer', key: 'ask', placeholder: 'Ask anything…' } } });
}
}
</script>
</body>
</html>
