<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat — home</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/smokedglass/tokens.css">
<link rel="stylesheet" href="ds/smokedglass/components/bundle.css">
<script src="ds/smokedglass/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-text)}a:hover{color:var(--label)}
</style>
</helmet>
<div data-theme="{{theme}}" class="sg-screen" style="width: 390px; height: 844px; font-family: var(--font-sans); color: var(--label); background: var(--canvas);">
<main class="sg-pane sg-pane-main" aria-label="Chat">
<div class="sg-pane-scroll" style="padding-bottom: 200px;">
<header class="sg-pane-header" style="padding-top: 72px;">
<p class="sg-pane-eyebrow footnote">Thursday 22 October</p>
<h1 class="sg-pane-title large-title">Chat</h1>
</header>
<div class="sg-pane-content">
<x-import component-from-global-scope="SmokedGlass.ListGroup" header="Needs you" glass="{{no}}">
<x-import component-from-global-scope="SmokedGlass.ListRow" icon="calendar" tint="orange" title="Lisbon trip" subtitle="Wants to add an event · 2 min" on-click="{{noop}}"></x-import>
<x-import component-from-global-scope="SmokedGlass.ListRow" icon="bubble" tint="indigo" title="Q4 planning" subtitle="Asked you a question · 1 h" on-click="{{noop}}"></x-import>
</x-import>
<x-import component-from-global-scope="SmokedGlass.ListGroup" header="Recent" glass="{{no}}">
<x-import component-from-global-scope="SmokedGlass.ListRow" icon="bubble" tint="teal" title="Kitchen remodel quotes" subtitle="Compared three offers · Yesterday" on-click="{{noop}}"></x-import>
<x-import component-from-global-scope="SmokedGlass.ListRow" icon="bubble" tint="green" title="Weekly review" subtitle="Moved 4 tasks to next week · Mon" on-click="{{noop}}"></x-import>
<x-import component-from-global-scope="SmokedGlass.ListRow" icon="bubble" tint="pink" title="Birthday ideas for Maja" subtitle="Saved 6 ideas to the wiki · Sun" on-click="{{noop}}"></x-import>
<x-import component-from-global-scope="SmokedGlass.ListRow" icon="bubble" tint="brown" title="Tax documents 2026" subtitle="Checklist created · 18 Oct" on-click="{{noop}}"></x-import>
</x-import>
</div>
</div>
<div class="sg-dock">
<x-import component-from-global-scope="SmokedGlass.Cluster" variant="{{c.variant}}" tabs="{{c.tabs}}" tab="{{c.tab}}" on-tab="{{noop}}" back="{{c.back}}" actions="{{c.actions}}" primary="{{c.primary}}" accessory="{{c.accessory}}" sheet="{{c.sheet}}" search="{{c.search}}" gather="{{c.gather}}" flat="{{c.flat}}" minimized="{{c.minimized}}" style="width: 100%;"></x-import>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const noop = function () {};
const TABS = [{ id: 'chat', label: 'Chat', icon: 'bubble' }, { id: 'calendar', label: 'Calendar', icon: 'calendar' }, { id: 'tasks', label: 'Tasks', icon: 'checklist', badge: 3 }, { id: 'wiki', label: 'Wiki', icon: 'book' }, { id: 'you', label: 'You', icon: 'person' }];
const SEARCH = { label: 'Search', placeholder: 'Search everything', onOpen: noop, onQuery: noop };
const CHAT_ACTIONS = [{ id: 'share', label: 'Share', icon: 'share' }, { id: 'rename', label: 'Rename', icon: 'square-pencil' }, { id: 'pin', label: 'Pin', icon: 'pin' }, { id: 'delete', label: 'Delete', icon: 'trash', destructive: true }];
const REPLY = { kind: 'composer', key: 'reply', placeholder: 'Reply…' };
const LATER = { icon: 'xmark', label: 'Later', onClick: noop };
return Object.assign({ theme: (this.props.dark ?? true) ? 'dark' : 'light', no: false, yes: true, noop: noop }, { c: { variant: 'row', tabs: TABS, tab: 'chat', search: SEARCH, accessory: { kind: 'composer', key: 'ask', placeholder: 'Ask anything…' } } });
}
}
</script>
</body>
</html>
