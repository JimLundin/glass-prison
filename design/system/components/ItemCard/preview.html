<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'dark';</script>
<style>body{margin:0;background:var(--canvas);color:var(--label);font-family:var(--font-sans)}</style><meta charset="utf-8"><title>ItemCard — preview</title>
<style>html,body{height:100%} #root{height:100%} .col{display:flex;flex-direction:column;gap:12px;max-width:460px}</style></head>
<body>
<div id="root" style="padding:20px;box-sizing:border-box;background:var(--canvas);min-height:100%"><div id="mount"></div></div>
<script>
  var S = window.SmokedGlass, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('mount')).render(h('div',{className:'col'},
  h(S.ItemCard,{icon:'book',tint:'teal',title:'Packing list — Lisbon',subtitle:'Wiki · 24 items · ready',href:'#'}),
  h(S.ItemCard,{icon:'calendar',tint:'orange',title:'Lisbon weekend',subtitle:'Calendar · Fri 13 – Sun 15 Nov',href:'#'})));

</body>
