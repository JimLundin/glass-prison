<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'dark';</script>
<style>body{margin:0;background:var(--canvas);color:var(--label);font-family:var(--font-sans)}</style><meta charset="utf-8"><title>TimeGrid — preview</title>
<style>html,body{height:100%} #root{height:100%} .box{max-width:560px}</style></head>
<body>
<div id="root" style="padding:20px;box-sizing:border-box;background:var(--canvas);min-height:100%"><div id="mount"></div></div>
<script>
  var S = window.SmokedGlass, h = React.createElement;
  var days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(n,i){return {name:n,num:String(9+i),selected:i===4};});
  var ev = [{day:0,start:'09:00',end:'09:30',title:'Standup',tint:'teal'},{day:1,start:'12:00',end:'13:00',title:'Lunch with Erik',tint:'pink'},{day:3,start:'14:00',end:'15:30',title:'Kitchen contractor',tint:'brown'},{day:4,start:'11:30',end:'12:30',title:'Lunch with Maja',tint:'pink'},{day:4,start:'17:40',end:'19:00',title:'Flight to Lisbon',tint:'blue',suggested:true},{day:5,start:'10:00',end:'12:00',title:'Walk through Alfama',tint:'orange',agent:true}];
  ReactDOM.createRoot(document.getElementById('mount')).render(h('div',{className:'box'}, h(S.TimeGrid,{days:days,events:ev,allDay:[{from:4,to:6,title:'Lisbon weekend',tint:'orange',agent:true}],startHour:8,endHour:19,hourHeight:36,compact:true})));
</script>
</body>
</html>
