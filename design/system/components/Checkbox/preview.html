<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'dark';</script>
<style>body{margin:0;background:var(--canvas);color:var(--label);font-family:var(--font-sans)}</style><meta charset="utf-8"><title>Checkbox — preview</title>
<style>html,body{height:100%} #root{height:100%} .col{display:flex;flex-direction:column;gap:4px;max-width:360px}</style></head>
<body>
<div id="root" style="padding:20px;box-sizing:border-box;background:var(--canvas);min-height:100%"><div id="mount"></div></div>
<script>
  var S = window.SmokedGlass, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('mount')).render(h('div',{className:'col'},
  h(S.Checkbox,{defaultChecked:true,strike:true},'Light rain shell'), h(S.Checkbox,null,'Two warm layers'), h('div',{style:{display:'flex',gap:'8px'}}, h(S.Checkbox,{label:'Done'}), h(S.Checkbox,{label:'Done',defaultChecked:true}))));
</script>
</body>
</html>
