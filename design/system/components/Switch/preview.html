<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'dark';</script>
<style>body{margin:0;background:var(--canvas);color:var(--label);font-family:var(--font-sans)}</style><meta charset="utf-8"><title>Switch — preview</title>
<style>html,body{height:100%} #root{height:100%} .box{width:360px}</style></head>
<body>
<div id="root" class="sg-stage"><i class="sg-blob sg-blob-a"></i><i class="sg-blob sg-blob-b"></i><i class="sg-blob sg-blob-c"></i><i class="sg-blob sg-blob-d"></i><div id="mount" style="display:contents"></div></div>
<script>
  var S = window.SmokedGlass, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('mount')).render(h('div',{className:'box'},
    h(S.ListGroup,null,
      h(S.ListRow,{title:'Search the web',accessory:h(S.Switch,{defaultChecked:true,'aria-label':'Search the web'})}),
      h(S.ListRow,{title:'Haptics',accessory:h(S.Switch,{'aria-label':'Haptics'})}))));
</script>
</body>
</html>
