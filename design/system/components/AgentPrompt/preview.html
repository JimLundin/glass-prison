<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">

<div id="root"></div>
<script>
  var S = window.SmokedGlass, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col' },
    h(S.AgentPrompt, { state: 'focused', title: 'Where are you flying from?' }),
    h(S.AgentPrompt, { state: 'pending', icon: 'clock', tint: 'indigo', title: 'When do you want to be back?', onOpen: function () {} }),
    h(S.AgentPrompt, { state: 'pending', kind: 'Permission', icon: 'calendar', tint: 'orange', title: 'Add “Lisbon weekend” to Calendar?', cta: 'Review', onOpen: function () {} }),
    h(S.AgentPrompt, { state: 'done', title: 'Window or aisle?', answer: 'Window' })));
