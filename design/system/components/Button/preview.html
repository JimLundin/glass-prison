<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'dark';</script>
<style>body{margin:0;background:var(--canvas);color:var(--label);font-family:var(--font-sans)}</style><meta charset="utf-8"><title>Button — preview</title>
<style>html,body{height:100%} #root{height:100%} .col{display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}</style></head>
<body>
<div id="root" class="sg-stage sg-stage-quiet"><i class="sg-blob sg-blob-a"></i><i class="sg-blob sg-blob-b"></i><i class="sg-blob sg-blob-c"></i><i class="sg-blob sg-blob-d"></i><div id="mount" style="display:contents"></div></div>
<script>
  var S = window.SmokedGlass, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('mount')).render(h('div',{className:'col'},
    h('div',{className:'row'}, h(S.Button,{variant:'filled'},'Continue'), h(S.Button,null,'Share'), h(S.Button,{variant:'tinted',icon:'plus'},'New Chat'), h(S.Button,{variant:'gray'},'Cancel'), h(S.Button,{variant:'plain'},'Edit')),
    h('div',{className:'row'}, h(S.Button,{variant:'filled',size:'sm'},'Done'), h(S.Button,{size:'sm',icon:'square-pencil'},'Rename'), h(S.Button,{variant:'tinted',size:'sm',destructive:true},'Delete'), h(S.Button,{variant:'filled',destructive:true,size:'sm'},'Delete Chat'), h(S.Button,{variant:'filled',size:'sm',disabled:true},'Send'))));
</script>
</body>
</html>
