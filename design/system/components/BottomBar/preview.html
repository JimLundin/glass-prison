<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'dark';</script>
<style>body{margin:0;background:var(--canvas);color:var(--label);font-family:var(--font-sans)}</style><meta charset="utf-8"><title>BottomBar — preview</title>
<style>html,body{height:100%} #root{height:100%} .col{display:flex;flex-direction:column;gap:14px;width:100%;max-width:520px;margin:auto auto 0}</style></head>
<body>
<div id="root" class="sg-stage sg-stage-quiet"><i class="sg-blob sg-blob-a"></i><i class="sg-blob sg-blob-b"></i><i class="sg-blob sg-blob-c"></i><i class="sg-blob sg-blob-d"></i><div id="mount" style="display:contents"></div></div>
<script>
  var S = window.SmokedGlass, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('mount')).render(h('div', { className: 'col' },
    h(S.BottomBar, { leading: h(S.IconButton, { icon: 'chevron-left', label: 'Back', variant: 'plain' }), center: h('span', { className: 'headline' }, 'Trip planning'), trailing: [h(S.IconButton, { key: 's', icon: 'square-pencil', label: 'Rename', variant: 'plain' }), h(S.IconButton, { key: 'm', icon: 'ellipsis', label: 'More', variant: 'plain' })] }),
    h(S.BottomBar, { leading: h(S.IconButton, { icon: 'xmark', label: 'Close', variant: 'plain' }), center: h(S.Button, { variant: 'filled' }, 'Save Changes') })));
</script>
</body>
</html>
