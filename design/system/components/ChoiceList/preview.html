<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'dark';</script>
<style>body{margin:0;background:var(--canvas);color:var(--label);font-family:var(--font-sans)}</style><meta charset="utf-8"><title>ChoiceList — preview</title>
<style>html,body{height:100%} #root{height:100%} .col{display:flex;flex-direction:column;gap:20px;max-width:520px}</style></head>
<body>
<div id="root" style="padding:20px;box-sizing:border-box;background:var(--canvas);min-height:100%"><div id="mount"></div></div>
<script>
  var S = window.SmokedGlass, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('mount')).render(h('div',{className:'col'},
  h(S.ChoiceList,{legend:'Single choice',options:['Before 18:00','Before 22:00','Any time Sunday','Monday morning'],defaultValue:'Before 22:00',columns:2}),
  h(S.ChoiceList,{legend:'Several',multiple:true,options:['Window seat','Checked bag'],defaultValue:['Checked bag'],other:'Something else…'})));
</script>
</body>
</html>
